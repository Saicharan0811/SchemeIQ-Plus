# ==============================================================================
# Render Blueprint Specification — SchemeIQ+ Production Architecture (Phase 9D.8)
# Zero-cost architecture: Single Free Web Service with local deterministic vector index.
# ==============================================================================
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # SchemeIQ+ Web API Service (Free Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: schemeiq-plus-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FLASK_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: WSGI_THREADS
        value: 2
      - key: CORS_ALLOWED_ORIGINS
        value: https://scheme-iq-plus.vercel.app
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: OPENAI_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: EMBEDDING_PROVIDER
        value: onnx
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: OMP_NUM_THREADS
        value: "1"
      - key: RAYON_NUM_THREADS
        value: "1"
