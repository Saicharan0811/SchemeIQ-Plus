# ==============================================================================
# Render Blueprint Specification — SchemeIQ+ Production Architecture (Phase 9D.7)
# ==============================================================================
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
# Phase 9D.7.5 sync trigger

services:
  # ----------------------------------------------------------------------------
  # 1. Standalone Chroma Vector Database Service (Private Service)
  # ----------------------------------------------------------------------------
  - type: pserv
    name: schemeiq-plus-chroma
    runtime: python
    region: oregon
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/start_chroma_service.py
    envVars:
      - key: RAYON_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: EMBEDDING_PROVIDER
        value: onnx
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2

  # ----------------------------------------------------------------------------
  # 2. SchemeIQ+ Web API Service (Free Web Service)
  # ----------------------------------------------------------------------------
  - type: web
    name: schemeiq-plus-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 1 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FLASK_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: WSGI_THREADS
        value: 1
      - key: CORS_ALLOWED_ORIGINS
        value: "*" # Replace with specific frontend URL once frontend is deployed
      - key: LOG_LEVEL
        value: INFO
      - key: EMBEDDING_PROVIDER
        value: onnx
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: OMP_NUM_THREADS
        value: "1"
      - key: RAYON_NUM_THREADS
        value: "1"
      - key: CHROMA_SERVER_HOST
        fromService:
          type: pserv
          name: schemeiq-plus-chroma
          property: host
      - key: CHROMA_SERVER_PORT
        value: "8000"
      - key: CHROMA_SERVER_SSL
        value: "false"

