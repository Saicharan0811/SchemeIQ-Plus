# ==============================================================================
# Render Blueprint Specification — SchemeIQ+ Backend Web Service (Phase 9B)
# ==============================================================================
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: schemeiq-plus-backend
    runtime: python
    region: oregon # or frankfurt / singapore based on user preference
    plan: free # or starter
    buildCommand: pip install -r requirements.txt
    # Single Gunicorn worker with 1 thread to ensure ChromaDB's native Rust/Tokio
    # runtime (chromadb_rust_bindings) is always called from the same OS thread on
    # which PersistentClient was initialized. Multi-thread (--threads >1) causes the
    # gthread worker to call into Tokio from a foreign thread, deadlocking the query.
    # Memory is safe: PyTorch was replaced by ONNX Runtime (Phase 9D.1), keeping
    # total server RAM ~200MB well within Render's 512MB limit.
    startCommand: gunicorn --workers 1 --threads 1 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FLASK_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: WSGI_THREADS
        value: 1
      - key: CORS_ALLOWED_ORIGINS
        value: "*" # Replace with specific frontend URL once frontend is deployed
      - key: LOG_LEVEL
        value: INFO
      - key: EMBEDDING_PROVIDER
        value: onnx
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: OMP_NUM_THREADS
        value: "1"
      - key: RAYON_NUM_THREADS
        value: "1"
